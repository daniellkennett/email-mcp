[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-mcp"
version = "0.1.0"
description = "Local MCP server for template-based email marketing through an SMTP relay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2",
    # Verify SMTP TLS against the OS trust store, not just Python's bundled roots:
    # required on any machine behind a TLS-inspecting proxy. See src/email_mcp/tls.py.
    "truststore>=0.9",
]

[project.scripts]
email-mcp = "email_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]
